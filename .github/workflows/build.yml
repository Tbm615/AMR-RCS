name: Build and test RCS

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUNBUFFERED: "1"
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Linux Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxkbcommon0 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-sync1 \
            libxcb-xfixes0 libxcb-xinerama0 libxcb-xkb1 libxkbcommon-x11-0 libnss3

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller websockets

      - name: Feature tests
        run: python tests/test_features.py

      - name: End-to-end test (source) against mock rosbridge
        run: python tests/test_e2e.py

      - name: Robot programs page against mock launcher
        run: python tests/test_robot_page.py

      - name: Page layout (split, tabs, page windows, presets), fusion, events
        run: python tests/test_layout.py

      - name: Per-robot data, packs, copying maps to and from the robot
        run: python tests/test_data.py

      - name: Why there is no camera picture, 3D map without a map frame
        run: python tests/test_camera_status.py

      - name: Battery frames, staying connected, the battery log per boot, Battery page and history
        run: python tests/test_battery.py

      - name: The robot's own E-STOP gate, with the app
        run: python tests/test_estop.py

      - name: Scheduled missions and run reports
        run: python tests/test_schedule.py

      - name: Several robots on the Fleet page
        run: python tests/test_fleet.py

      - name: Robot models (URDF import, wheels in their wells, 2D shape, packs)
        run: python tests/test_robot_model.py

      - name: Sign-in, roles and audit log through the robot's gateway
        run: python tests/test_gateway.py

      - name: Versions of the robot side, new releases
        run: python tests/test_updates.py

      - name: Health checks, diagnostic bundles, crash reports
        run: python tests/test_diagnostics.py

      - name: Remote alerts (Telegram and e-mail, faked)
        run: python tests/test_alerts.py

      - name: Going to charge by itself
        run: python tests/test_charging.py

      - name: The app in Vietnamese
        run: python tests/test_i18n.py

      - name: Statistics and the PDF report
        run: python tests/test_stats.py

      - name: The ? button
        run: python tests/test_help.py

      - name: Keepout and speed zones
        run: python tests/test_zones.py

      - name: Responsiveness, reconnect and 3D map under robot-sized traffic
        # shared CI runners are slower than an operator PC: allow longer stalls
        env:
          RCS_MAX_STALL_S: "2.0"
        run: python tests/test_stress.py

      - name: Build (console)
        run: python build.py

      - name: End-to-end test (built binary) against mock rosbridge
        run: python tests/test_built_binary_e2e.py

      - name: Package Linux build
        if: runner.os == 'Linux'
        run: tar czf rcs-linux-x86_64.tar.gz -C dist rcs

      - name: Linux package (.deb)
        if: runner.os == 'Linux'
        run: bash installer/make_deb.sh .

      - name: Package Windows console build
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/rcs -DestinationPath rcs-windows-x86_64-console.zip

      - name: Build (windowed, no console)
        if: runner.os == 'Windows'
        env:
          RCS_WINDOWED: "1"
        run: python build.py

      - name: End-to-end test (windowed build) against mock rosbridge
        if: runner.os == 'Windows'
        run: python tests/test_built_binary_e2e.py

      - name: Package Windows windowed build
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/rcs -DestinationPath rcs-windows-x86_64.zip

      # An installer too; does not hold the release up if Inno Setup is missing
      - name: Windows installer (Inno Setup)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          $v = (Select-String -Path rcs/__init__.py -Pattern '__version__ = "(.+)"').Matches[0].Groups[1].Value
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          & $iscc "/DAppVersion=$v" installer\rcs.iss
          Copy-Item dist\rcs-windows-x86_64-setup.exe .

      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: rcs-linux-x86_64
          path: |
            rcs-linux-x86_64.tar.gz
            rcs_*.deb

      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: rcs-windows-x86_64
          path: |
            rcs-windows-x86_64.zip
            rcs-windows-x86_64-console.zip
            rcs-windows-x86_64-setup.exe

  # On a version tag, publish the tested builds as a GitHub Release.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la artifacts
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" artifacts/* --clobber
            gh release edit "$GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md
          else
            # a beta (v0.6.0-beta.1) is a pre-release: "latest" stays on the last stable one
            pre=""
            case "$GITHUB_REF_NAME" in *-*) pre="--prerelease" ;; esac
            gh release create "$GITHUB_REF_NAME" artifacts/* $pre \
              --title "RCS $GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md
          fi
